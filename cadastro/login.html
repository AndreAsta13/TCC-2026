<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login — Transcreva.IA</title>

    <!-- TAILWIND CDN + FONTE PLUS JAKARTA SANS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>

<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- LUZES NEON DE FUNDO -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[400px] bg-gradient-to-tr from-indigo-600/30 via-emerald-500/20 to-purple-600/30 blur-[140px] -z-10 pointer-events-none rounded-full"></div>
    <div class="fixed -bottom-40 -left-40 w-[500px] h-[500px] bg-indigo-900/20 blur-[150px] -z-10 pointer-events-none rounded-full"></div>

    <!-- GRID DECORATIVO -->
    <div class="fixed inset-0 -z-10 opacity-[0.03] bg-[linear-gradient(to_right,#ffffff_1px,transparent_1px),linear-gradient(to_bottom,#ffffff_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>

    <!-- HEADER GLASS -->
    <header class="w-full border-b border-white/10 backdrop-blur-xl bg-[#0b0f19]/70 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-emerald-400 p-[1px] shadow-lg shadow-indigo-500/20">
                    <div class="w-full h-full bg-[#0b0f19] rounded-[11px] flex items-center justify-center">
                        <img src="../Image/image.png" class="w-6 h-6 object-contain group-hover:scale-110 transition-transform" alt="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25682.png'">
                    </div>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-white">
                    Transcreva<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400">.IA</span>
                </span>
            </a>

            <div class="flex items-center gap-3">
                <a href="../index.html" class="text-gray-400 hover:text-white font-semibold text-sm px-4 py-2 rounded-xl transition hover:bg-white/5">
                    ← Início
                </a>
                <a href="cadastro.html" class="bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 hover:scale-[1.02] active:scale-95">
                    Criar conta
                </a>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (CARD DE LOGIN) -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-[#121827]/80 backdrop-blur-2xl border border-white/10 rounded-3xl p-8 sm:p-10 shadow-2xl relative overflow-hidden">
            <!-- Linha decorativa no topo -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 via-emerald-400 to-indigo-500"></div>

            <!-- ÍCONE & TÍTULO -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 rounded-2xl flex items-center justify-center font-bold text-xl mx-auto mb-4 shadow-inner">
                    🔑
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Bem-vindo de volta</h2>
                <p class="text-gray-400 text-sm mt-2">Acesse sua conta para visualizar suas transcrições</p>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="formLogin" class="flex flex-col gap-5">
                <!-- CAMPO EMAIL -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">E-mail acadêmico ou pessoal</label>
                    <div class="relative">
                        <input type="email" id="email" placeholder="seuemail@exemplo.com" required 
                            class="w-full px-4 py-3.5 bg-[#0b0f19]/60 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                    </div>
                </div>

                <!-- CAMPO SENHA -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="senha" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider">Senha</label>
                    </div>
                    <div class="relative">
                        <input type="password" id="senha" placeholder="••••••••" required 
                            class="w-full px-4 py-3.5 bg-[#0b0f19]/60 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                    </div>
                </div>

                <!-- BOTÃO DE ENTRAR -->
                <button type="submit" 
                    class="w-full mt-2 py-4 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold rounded-xl text-base transition-all shadow-lg shadow-indigo-600/30 hover:scale-[1.01] active:scale-95 flex items-center justify-center gap-2">
                    Entrar na plataforma
                </button>
            </form>

            <!-- RODAPÉ DO CARD -->
            <div class="mt-8 pt-6 border-t border-white/5 text-center text-xs text-gray-400">
                Ainda não tem uma conta? 
                <a href="cadastro.html" class="text-emerald-400 font-semibold hover:underline">Cadastre-se gratuitamente</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="border-t border-white/10 py-6 bg-[#080b12]/50 text-center text-gray-500 text-xs">
        <p>© 2026 Transcreva.IA — Projeto Acadêmico (TCC)</p>
    </footer>

    <!-- LÓGICA JAVASCRIPT (MANTIDA INTEGRALMENTE) -->
    <script>
    document.getElementById('formLogin').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const btn = e.target.querySelector('button[type="submit"]');
      const textoOriginal = btn.innerHTML;

      if (!email || !senha) {
        alert('Preencha email e senha.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg> Entrando...`;

      try {
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (!res.ok || !data.sucesso) {
          alert(data.erro || 'Email ou senha inválidos.');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', data.usuario.nome);

        window.location.href = '../Página/ground_truth_index.html';

      } catch (err) {
        console.error('Erro no login:', err);
        alert('Erro ao conectar com o servidor...');
      } finally {
        btn.disabled = false;
        btn.innerHTML = textoOriginal;
      }
    });
    </script>

</body>
</html>
