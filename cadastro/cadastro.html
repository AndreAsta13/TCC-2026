<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cadastro</title>

<link rel="stylesheet" href="../css/output.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen font-[Inter]">

<!-- HEADER -->
<header class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">

  <h1 class="text-2xl font-bold text-indigo-700">
    Transcreva.IA
  </h1>

  <div class="flex items-center gap-4">

    <a href="../index.html"
       class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
       Início
    </a>

  </div>

</header>

<!-- CONTEÚDO -->
<main class="flex items-center justify-center px-4 py-10">

<div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl">

<h2 class="text-2xl font-bold text-center mb-6">Cadastro</h2>

<form id="formCadastro" class="flex flex-col gap-4">

<input type="text" id="nome" placeholder="Nome" required class="px-4 py-3 border rounded-lg" />

<input type="email" id="email" placeholder="Email" required class="px-4 py-3 border rounded-lg" />

<input type="password" id="senha" placeholder="Senha" required class="px-4 py-3 border rounded-lg" />

<button type="submit" class="bg-indigo-600 text-white py-3 rounded-lg">
Cadastrar
</button>

</form>
<p class="text-center text-sm text-gray-500 mt-4">
Já tem conta?
<a href="login.html" class="text-indigo-600 hover:underline">
Fazer login
</a>
</p>
<!-- Painel de notificação -->
<div id="painelAviso" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 hidden px-8 py-6 rounded-2xl shadow-xl text-white font-semibold text-lg text-center transition-all duration-200 z-50">
  <span id="painelTexto"></span>
</div>

</div>

</main>

<script>
document.getElementById("formCadastro").addEventListener("submit", async (e) => {
  e.preventDefault();

  const nome = document.getElementById("nome").value;
  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;

  try {
    const res = await fetch("http://localhost:3000/cadastro", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, email, senha }),
    });

    const data = await res.json();

    if (data.sucesso) {
      mostrarAviso("Cadastro realizado com sucesso!", "sucesso");
      document.getElementById("formCadastro").reset();
    } else {
      mostrarAviso(data.erro || "Erro ao cadastrar.", "erro");
    }
  } catch (err) {
    console.error("Erro no cadastro:", err);
    mostrarAviso("Erro ao conectar com o servidor.", "erro");
  }
});

function mostrarAviso(mensagem, tipo = "sucesso") {
  const painel = document.getElementById("painelAviso");
  const texto = document.getElementById("painelTexto");

  texto.textContent = mensagem;

  // reseta classes de cor antes de aplicar a nova
  painel.classList.remove("bg-emerald-600", "bg-red-600", "hidden");
  painel.classList.add(tipo === "sucesso" ? "bg-emerald-600" : "bg-red-600");

  // some sozinho depois de 4 segundos
  clearTimeout(painel._timeout);
  painel._timeout = setTimeout(() => {
    painel.classList.add("hidden");
  }, 4000);
}
</script>

</body>
</html>
